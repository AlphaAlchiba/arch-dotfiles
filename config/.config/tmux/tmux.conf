##### Core

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -ga terminal-overrides ",*:Km"

set -g mode-keys vi

# Yazi: let terminal queries (DA1, DSR) pass through to the real terminal
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Copy mode — vim-like selection and yank (v=select, y=yank+exit, q=exit)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g extended-keys on
set -g extended-keys-format csi-u

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g status-position bottom
set -g status-interval 5

set -g repeat-time 700


##### Prefix

unbind C-b

set -g prefix M-Space
bind M-Space send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"


##### Status Line

set -g status on

set -g status-style bg=#24243a,fg=colour244
set -g status-left ''
set -g status-left-style bg=default,fg=colour244
set -g status-left-length 99
set -g status-right ''
set -g status-right-length 99

set -g status-justify absolute-centre

set -g window-status-separator ' '
# set -g window-status-format ' #I #W '
# set -g window-status-current-format ' #I #W '
set -g window-status-format '#{?window_start_flag,#[bg=#181825]#[fg=#FAB387] #S #[bg=default]#[fg=colour244]  ,} #I:#W '
set -g window-status-current-format '#{?window_start_flag,#[bg=#181825]#[fg=#FAB387]#[bold] #S #[bg=default]#[fg=colour255]#[bold]  ,} #I:#W '
set -g window-status-style bg=default,fg=colour244
set -g window-status-current-style bg=default,fg=colour255,bold

set -g pane-border-style fg=colour234
set -g pane-active-border-style fg=colour234
set -g pane-border-lines heavy

set -g message-style bg=default,fg=colour255
set -g mode-style bg=colour238,fg=colour255

set -g focus-events on


##### Splits

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -f -c "#{pane_current_path}"
bind _ split-window -v -f -c "#{pane_current_path}"


##### Windows

bind Enter new-window -c "#{pane_current_path}"
bind , command-prompt -I "#W" "rename-window '%%'"
bind w choose-window
bind C kill-window

bind-key -r n next-window
bind-key -r p previous-window


##### Panes

# bind x confirm-before -p "kill pane #P? (y/n)" kill-pane
bind c kill-pane
bind x kill-pane

bind z resize-pane -Z
bind-key -r H resize-pane -L 3
bind-key -r J resize-pane -D 3
bind-key -r K resize-pane -U 3
bind-key -r L resize-pane -R 3

bind m command-prompt -p "move pane to window:" "join-pane -t ':%%'"
bind M command-prompt -p "move pane right into window:" "join-pane -h -t ':%%'"


##### Pane Navigation

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


##### Popups

set -g popup-border-lines rounded
set -g popup-border-style "fg=colour238"
set -g popup-style "bg=default"

# Clear old global-keys that were moved to prefix-based bindings
unbind-key -n C-t
unbind-key -n C-g
unbind-key -n C-p

bind g display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "lazygit"
bind N display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind s display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
bind S choose-session
bind y display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "zsh -ic y"
bind P display-popup \
  -w 80% \
  -h 80% \
  -E 'nvim ~/.zshrc'
bind t display-popup \
  -d "#{pane_current_path}" \
  -w 75% \
  -h 75% \
  -E "zsh"


##### Global Key Handlers

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|l?n?vim?x?)(diff)?$'"

# Ctrl+Backspace pass-through (Kitty sends CSI-u, tmux forwards to app)
bind-key -n C-BSpace send-keys "\e[127;5u"

# Shift+Enter pass-through (mirror Ctrl+Backspace approach)
bind-key -n S-Enter send-keys S-Enter

# Ctrl+h/j/k/l pane navigation (pass through to vim when detected)
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

