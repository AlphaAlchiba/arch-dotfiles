# hypridle.conf — idle, lock, and display power policy (tracked default).
#
# Machine-specific overrides belong in hypridle_local.conf (gitignored) in this
# same directory. hyprland.lua prefers the local file when it exists; see
# config/hypr/README.md.
#
# This default enables suspend. On machines where resume from s2idle does not
# restore the Thunderbolt/USB4 DisplayPort tunnel or the dock's USB devices,
# create a local override without the suspend listener and keep the machine on
# while powering the displays off via DPMS.

general {
    lock_cmd = pidof hyprlock || hyprlock   # avoid starting multiple instances.
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim the internal panel (laptop). No-op on machines without a backlight.
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Lock before the displays are powered down.
listener {
    timeout = 330
    on-timeout = loginctl lock-session
}

# Power the displays off without suspending the machine.
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}

# Suspend the machine.
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
