# hyprlock.conf — Catppuccin Mocha
# Lock screen for hyprlock (auto-read from ~/.config/hypr/hyprlock.conf)

$font = JetBrainsMono Nerd Font

$rosewater = rgb(f5e0dc)
$mauve = rgb(cba6f7)
$red = rgb(f38ba8)
$peach = rgb(fab387)
$yellow = rgb(f9e2af)
$green = rgb(a6e3a1)
$teal = rgb(94e2d5)
$sky = rgb(89dceb)
$blue = rgb(89b4fa)
$lavender = rgb(b4befe)
$text = rgb(cdd6f4)
$subtext1 = rgb(bac2de)
$overlay0 = rgb(6c7086)
$surface0 = rgb(313244)
$base = rgb(1e1e2e)
$mantle = rgb(181825)
$crust = rgb(11111b)

general {
    hide_cursor = true
}

# Blurred screenshot of the current screen, tinted with the base color
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    color = $base
}

# Clock
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 96
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $subtext1
    font_size = 24
    font_family = $font
    position = 0, 45
    halign = center
    valign = center
}

# Username
label {
    monitor =
    text = $USER
    color = $blue
    font_size = 20
    font_family = $font
    position = 0, -70
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 360, 55
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $lavender
    inner_color = $surface0
    font_color = $text
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    hide_input = false
    check_color = $green
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $yellow
    position = 0, -130
    halign = center
    valign = center
}
