# Theme
include Catppuccin-Mocha.conf
include ~/.config/kitty/colors.conf
# Fonts
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 9.6
# Look and Feel 
cursor_trail 3
custom_shaders cursor-trail-blaze
confirm_os_window_close 0
enable_audio_bell no
window_padding_width 0

# Copy-on-select: drag to select and it lands on the system clipboard
copy_on_select clipboard
clear_selection_on_clipboard_loss yes
# Strip trailing whitespace on normal (not rectangular) copies
strip_trailing_spaces smart
# More scrollback than the 2000-line default
scrollback_lines 10000

# Disabled so tmux can receive C-N (Ctrl+Shift+N) for its new-session popup
map ctrl+shift+n no_op
map ctrl+backspace send_text all \x1b[127;5u
map shift+enter send_text all \x1b[13;2u
resize_in_steps yes
