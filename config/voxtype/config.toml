# Voxtype configuration — managed via dotfiles (stowed to ~/.config/voxtype)
# Full annotated reference: https://voxtype.io/docs/CONFIGURATION

state_file = "auto"

[hotkey]
# Built-in hotkey disabled — Hyprland keybindings (Super+R) control recording
enabled = false
key = "SCROLLLOCK"
modifiers = []

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60
# Pause MPRIS media players (Spotify, Firefox, etc.) while dictating,
# resume them when recording stops. Requires playerctl.
pause_media = true

[audio.feedback]
enabled = true
theme = "subtle"
volume = 0.4

[whisper]
# Multilingual EN/FR alternative (slower, can misdetect mixed speech):
# model = "small"
# language = ["en", "fr"]
model = "small.en"     # English-only — fastest, best for English dictation
language = "en"
translate = false
# Use the NVIDIA dGPU (index 1) for Vulkan inference, not the Intel iGPU (index 0)
gpu_device = 1
# Faster transcription for short dictations (smaller context window for clips <22.5s)
context_window_optimization = true
# Experimental streaming — types ~5s chunks while speaking, but cuts sentences
# at chunk boundaries and adds "..." artifacts. Disabled: clean all-at-once output.
# eager_processing = true
# eager_chunk_secs = 5.0
# eager_overlap_secs = 0.5

[output]
mode = "type"
fallback_to_clipboard = true
type_delay_ms = 0

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = false

[text]
spoken_punctuation = true
filter_filler_words = true

[vad]
enabled = true
