# faillock policy installed from dotfiles (system/security/faillock.conf).
#
# Upstream defaults are deny=3 / unlock_time=600. deny=3 leaves no headroom:
# a single screen-lock event can contribute several failures, and a 10 minute
# lockout is indistinguishable from "wrong password" after waking the screens.
# Keep the protection, but make an accidental burst harmless and short-lived.
#
# Installed by `./install.sh --pam` (or --system); the previous file is kept
# as /etc/security/faillock.conf.bak.

deny = 10
unlock_time = 60
